<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Engine</title>
<style>
  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: monospace;
    padding: 40px;
    max-width: 800px;
    margin: auto;
  }
  .panel {
    background: #11111a;
    border: 1px solid #33334a;
    padding: 20px;
    margin-top: 30px;
  }
  h2, h3 {
    color: #e0e0ff;
  }
  input, select {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    background: #11111a;
    border: 1px solid #33334a;
    color: #e0e0ff;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #11111a;
    border: 1px solid #33334a;
    color: #e0e0ff;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>Personal Engine</h2>

<div class="panel">
  <h3>Your Stability State</h3>

  <label>Stability</label>
  <select id="stability">
    <option>Stable</option>
    <option>Strained</option>
    <option>Depleted</option>
  </select>

  <label>Energy Debt</label>
  <input id="energyDebt" type="number" value="0">

  <label>Burnout Risk (0–100)</label>
  <input id="burnoutRisk" type="number" value="0">

  <button onclick="sendSignal()">Send Signal</button>
  <div id="status"></div>
</div>

<script>
const API = "https://cns-1-3yet.onrender.com/cns/v1/signal/person";


async function sendSignal() {
  const payload = {
    id: "patrick-local",
    stability: document.getElementById("stability").value,
    energyDebt: Number(document.getElementById("energyDebt").value),
    burnoutRisk: Number(document.getElementById("burnoutRisk").value)
  };

async function sendSignal() {
  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
}


  document.getElementById("status").textContent = "Signal sent.";
}
</script>

</body>
</html>
