<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Engine</title>
<style>
  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: monospace;
    padding: 40px;
    max-width: 800px;
    margin: auto;
  }
  .panel {
    background: #11111a;
    border: 1px solid #33334a;
    padding: 20px;
    margin-top: 30px;
  }
  h2, h3 {
    color: #e0e0ff;
  }
  input, select {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    background: #11111a;
    border: 1px solid #33334a;
    color: #e0e0ff;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #11111a;
    border: 1px solid #33334a;
    color: #e0e0ff;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>Community Engine</h2>

<div class="panel">
  <h3>Community Stress Signal</h3>

  <label>City</label>
  <input id="city" value="Sault Ste. Marie">

  <label>Status</label>
  <select id="status">
    <option>Stable</option>
    <option>Strained</option>
    <option>Critical</option>
  </select>

  <label>Shortages (comma separated)</label>
  <input id="shortages" value="">

  <label>Volunteer Gap (0–1)</label>
  <input id="volunteerGap" type="number" step="0.1" value="0">

  <button onclick="sendCommunity()">Send Signal</button>
  <div id="statusBox"></div>
</div>

<script>
const API = "https://cns-1-3yet.onrender.com/cns/v1/signal/community";


async function sendCommunity() {
  const payload = {
    city: document.getElementById("city").value,
    status: document.getElementById("status").value,
    shortages: document.getElementById("shortages").value.split(",").map(s => s.trim()),
    volunteerGap: Number(document.getElementById("volunteerGap").value)
  };

async function sendSignal() {
  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
}


  document.getElementById("statusBox").textContent = "Community signal sent.";
}
</script>

</body>
</html>
